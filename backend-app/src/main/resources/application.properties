spring.application.name=beam-academy

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/beam_academy?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

beam.openai.api-key=${OPENAI_API_KEY:}
beam.openai.model=${OPENAI_MODEL:gpt-4o-mini}
